name: Build debug APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android cmdline-tools and add to PATH
        run: |
          SDKMANAGER_PATH=$(find "$ANDROID_HOME" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "Could not find sdkmanager under ANDROID_HOME ($ANDROID_HOME)"
            exit 1
          fi
          echo "Found sdkmanager at: $SDKMANAGER_PATH"
          echo "$(dirname "$SDKMANAGER_PATH")" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate sample map
        run: npm run preprocess

      - name: Build web app
        run: npx ng build --configuration production

      - name: Sync Capacitor android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: open-ear-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
