name: Build debug APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Installs/updates the Android SDK and non-interactively accepts all
      # licenses, avoiding a hang if the project needs an SDK platform/tools
      # version that isn't already present on the runner.
      - uses: android-actions/setup-android@v3

      - name: Install required Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Caches Gradle dependencies between runs so this doesn't re-download
      # everything from scratch every time.
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate sample map
        run: npm run preprocess

      - name: Build web app
        run: npx ng build --configuration production

      - name: Sync Capacitor android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: open-ear-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
