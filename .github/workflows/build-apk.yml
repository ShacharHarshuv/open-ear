name: Build debug APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install required Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate sample map
        run: npm run preprocess

      - name: Build web app
        run: npx ng build --configuration production

      - name: Sync Capacitor android project
        run: npx cap sync android

      - name: Create local debug keystore
        working-directory: android/app
        run: |
          keytool -genkeypair -v -keystore openear-ci.jks \
            -storepass 4231867590 -alias openear -keypass 4231867590 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=US"

      - name: Point signing config at the CI keystore
        run: |
          sed -i "s|storeFile file(.*)|storeFile file('openear-ci.jks')|" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: open-ear-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
