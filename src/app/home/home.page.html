<ion-header [translucent]="true">
  <ion-toolbar [color]="'primary'">
    <ion-title> OpenEar </ion-title>
    <ion-buttons slot="end">
      <ion-button [href]="'https://github.com/ShacharHarshuv/open-ear'">
        <ion-icon slot="icon-only" name="logo-github"></ion-icon>
      </ion-button>
      <ion-button [routerLink]="'/about'">
        <ion-icon slot="icon-only" name="information-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="exercise-grid">
    @for (exercise of exerciseList; track exercise) {
    <app-exercise-summary [exercise]="exercise"></app-exercise-summary>
    }
  </div>
</ion-content>
